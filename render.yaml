databases:
  - name: locimmo-db
    plan: free
    region: frankfurt
    databaseName: locimmo
    user: locimmo
    postgresMajorVersion: "16"

services:
  - type: web
    name: locimmo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/properties
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: locimmo-db
          property: connectionString
      - key: JWT_SECRET_KEY
        value: /app/var/jwt/private.pem
      - key: JWT_PUBLIC_KEY
        value: /app/var/jwt/public.pem
      - key: JWT_PASSPHRASE
        value: ""
      - key: JWT_TTL
        value: "3600"
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: CORS_ALLOW_ORIGIN
        value: ^https://.*onrender\.com$

  - type: web
    runtime: static
    name: locimmo-front
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
